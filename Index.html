<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio - Examen Cultura Digital</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #fdfbff, #dd903c);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      text-align: center;
    }
    input[type="text"] {
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 5px;
      margin-bottom: 20px;
      font-size: 16px;
    }
    button {
      background-color: #00c9ff;
      border: none;
      padding: 10px 20px;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #009ec3;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Bienvenido al Examen</h2>
    <input type="text" id="nombre" placeholder="Ingresa tu nombre">
    <button onclick="iniciar()">Ingresar</button>
  </div>

  <script>
    function iniciar() {
      const nombre = document.getElementById("nombre").value.trim().toLowerCase();
      if (!nombre) {
        alert("Por favor, escribe tu nombre.");
        return;
      }

      if (nombre === "admin") {
        window.location.href = "admin.html";
      } else {
        localStorage.setItem("alumnoNombre", nombre);
        window.location.href = "examen.html";
      }
    }
  </script>
</body>
</html>
