<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
  <script src="firebaseConfig.js"></script>
</head>
<body class="bg-gray-100">
  <div class="max-w-sm mx-auto mt-10 p-6 bg-white rounded-lg shadow-xl">
    <h1 class="text-2xl font-bold mb-4 text-center">Iniciar Sesión</h1>
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="username" class="block text-gray-700">Nombre de Usuario:</label>
        <input type="text" id="username" class="w-full p-2 border rounded" placeholder="Nombre de Usuario" required />
      </div>
      <div>
        <label for="password" class="block text-gray-700">Contraseña:</label>
        <input type="password" id="password" class="w-full p-2 border rounded" placeholder="Contraseña" required />
      </div>
      <div class="text-center mt-4">
        <button type="submit" id="loginBtn" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Iniciar Sesión</button>
      </div>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const username = usernameInput.value;
      const password = passwordInput.value;

      // Aquí validamos que el admin sea "admin" y la contraseña sea "1223"
      if (username === "admin" && password === "1223") {
        // Redirige al administrador
        window.location.href = "admin.html";
      } else {
        // Redirige a la página del alumno
        localStorage.setItem("alumno", username);
        window.location.href = "alumno.html";
      }
    });
  </script>
</body>
</html>
